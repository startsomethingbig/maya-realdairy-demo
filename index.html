<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maya — Real Dairy Customer Service</title>
  <meta name="description" content="Speak live with Real Dairy's AI customer service agent. Australian-owned, 250+ staff, full B2B and retail dairy supply." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0a3d62;
      --navy-deep: #062847;
      --navy-soft: #14507a;
      --cream: #faf7f0;
      --cream-deep: #f3ede0;
      --gold: #c89a2b;
      --gold-soft: #e0b94a;
      --green: #2a9d63;
      --green-soft: #d8f0e2;
      --red: #c4392a;
      --grey-900: #1f2937;
      --grey-700: #374151;
      --grey-500: #6b7280;
      --grey-300: #d1d5db;
      --line: #e6e1d4;
      --line-soft: #efeadc;
      --white: #ffffff;
      --shadow-sm: 0 1px 2px rgba(6, 40, 71, 0.05);
      --shadow-md: 0 4px 16px rgba(6, 40, 71, 0.08);
      --shadow-lg: 0 20px 60px rgba(6, 40, 71, 0.12);
      --shadow-card: 0 24px 80px rgba(6, 40, 71, 0.10), 0 4px 16px rgba(6, 40, 71, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--cream);
      background-image:
        radial-gradient(circle at 20% 0%, rgba(20, 80, 122, 0.04), transparent 50%),
        radial-gradient(circle at 90% 100%, rgba(200, 154, 43, 0.05), transparent 55%);
      color: var(--navy-deep);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ====== HEADER ====== */
    header {
      padding: 22px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line-soft);
      background: rgba(250, 247, 240, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-mark {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
      color: var(--cream);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Instrument Serif', serif;
      font-weight: 400;
      font-size: 20px;
      box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.15);
      letter-spacing: -0.02em;
    }
    .logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }
    .logo-name {
      font-weight: 700;
      font-size: 15px;
      color: var(--navy-deep);
      letter-spacing: -0.01em;
    }
    .logo-tag {
      font-size: 11px;
      color: var(--grey-500);
      font-weight: 500;
      margin-top: 1px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .header-badge {
      font-size: 12px;
      font-weight: 600;
      color: var(--navy);
      padding: 6px 12px;
      border-radius: 999px;
      background: white;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-badge .dot {
      width: 6px; height: 6px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(42, 157, 99, 0.18);
    }

    /* ====== MAIN ====== */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 24px 32px;
    }
    .container {
      width: 100%;
      max-width: 680px;
      text-align: center;
    }

    /* ====== HERO ====== */
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 20px;
      padding: 6px 14px;
      background: rgba(200, 154, 43, 0.08);
      border-radius: 999px;
      border: 1px solid rgba(200, 154, 43, 0.18);
      opacity: 0;
      animation: fadeUp 0.7s 0.05s forwards;
    }
    .eyebrow svg { width: 12px; height: 12px; }
    h1 {
      font-size: 52px;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.025em;
      color: var(--navy-deep);
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeUp 0.7s 0.15s forwards;
    }
    h1 .serif {
      font-family: 'Instrument Serif', serif;
      font-weight: 400;
      font-style: italic;
      letter-spacing: -0.01em;
      color: var(--navy);
    }
    .sub {
      font-size: 18px;
      line-height: 1.55;
      color: var(--grey-700);
      max-width: 520px;
      margin: 0 auto 44px;
      opacity: 0;
      animation: fadeUp 0.7s 0.25s forwards;
    }

    /* ====== CALL CARD ====== */
    .call-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 44px 36px 36px;
      box-shadow: var(--shadow-card);
      position: relative;
      opacity: 0;
      animation: fadeUp 0.7s 0.35s forwards;
      overflow: hidden;
    }
    .call-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-soft), transparent);
      opacity: 0.6;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--grey-500);
      margin-bottom: 28px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 6px 14px;
      background: var(--cream);
      border-radius: 999px;
      transition: all 0.3s ease;
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--grey-300);
      transition: background 0.3s ease;
    }
    .status.live {
      background: var(--green-soft);
      color: var(--green);
    }
    .status.live .status-dot { background: var(--green); animation: pulse 1.5s infinite; }
    .status.connecting { background: rgba(200, 154, 43, 0.12); color: var(--gold); }
    .status.connecting .status-dot { background: var(--gold); animation: pulse 0.8s infinite; }
    .status.ended { background: rgba(196, 57, 42, 0.08); color: var(--red); }
    .status.ended .status-dot { background: var(--red); }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 currentColor; }
      50% { opacity: 0.7; transform: scale(1.25); box-shadow: 0 0 0 6px transparent; }
    }

    .call-btn-wrap {
      position: relative;
      display: inline-block;
    }
    .call-btn-wrap::before,
    .call-btn-wrap::after {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1.5px solid var(--navy);
      opacity: 0;
      pointer-events: none;
    }
    .call-btn-wrap.idle::before {
      animation: ring 2.4s ease-out infinite;
    }
    .call-btn-wrap.idle::after {
      animation: ring 2.4s 1.2s ease-out infinite;
    }
    @keyframes ring {
      0% { opacity: 0.5; transform: scale(1); }
      80%, 100% { opacity: 0; transform: scale(1.5); }
    }

    .call-btn {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--navy-soft) 0%, var(--navy-deep) 100%);
      color: white;
      cursor: pointer;
      box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,0.15);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.3s ease;
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .call-btn:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 28px 70px rgba(6, 40, 71, 0.20), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .call-btn:active:not(:disabled) { transform: translateY(-1px) scale(1); }
    .call-btn.live {
      background: linear-gradient(135deg, var(--red) 0%, #9c2d1f 100%);
    }
    .call-btn.connecting {
      background: linear-gradient(135deg, var(--gold-soft) 0%, var(--gold) 100%);
      cursor: wait;
    }
    .call-btn svg { width: 42px; height: 42px; }
    .call-btn:disabled { opacity: 0.85; }

    .call-label {
      margin-top: 22px;
      font-size: 17px;
      font-weight: 700;
      color: var(--navy-deep);
      letter-spacing: -0.01em;
    }
    .call-hint {
      margin-top: 6px;
      font-size: 13px;
      color: var(--grey-500);
      font-weight: 500;
    }

    /* ====== SUGGESTIONS ====== */
    .suggestions {
      margin-top: 36px;
      padding-top: 28px;
      border-top: 1px dashed var(--line);
    }
    .suggestions-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--grey-500);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 14px;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .chip {
      background: var(--cream);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      color: var(--navy-deep);
      font-weight: 500;
      transition: all 0.18s ease;
      cursor: default;
    }
    .chip:hover {
      background: white;
      border-color: var(--navy-soft);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    /* ====== TRUST STRIP ====== */
    .trust-strip {
      margin-top: 36px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      opacity: 0;
      animation: fadeUp 0.7s 0.45s forwards;
    }
    .trust-item {
      padding: 18px 12px;
      text-align: center;
    }
    .trust-num {
      font-family: 'Instrument Serif', serif;
      font-size: 28px;
      font-weight: 400;
      color: var(--navy);
      line-height: 1;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .trust-label {
      font-size: 12px;
      color: var(--grey-500);
      font-weight: 500;
      line-height: 1.35;
    }

    /* ====== TRANSCRIPT DRAWER ====== */
    .transcript-drawer {
      position: fixed;
      bottom: 0;
      left: 0; right: 0;
      max-height: 60vh;
      background: white;
      border-top: 1px solid var(--line);
      box-shadow: 0 -20px 60px rgba(6, 40, 71, 0.12);
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      display: flex;
      flex-direction: column;
    }
    .transcript-drawer.open {
      transform: translateY(0);
    }

      padding: 14px 24px 12px;
